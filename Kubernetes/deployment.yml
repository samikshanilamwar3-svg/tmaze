apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-tvmaze
  labels:
    app: netflix-tvmaze
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-tvmaze
  template:
    metadata:
      labels:
        app: netflix-tvmaze
    spec:
      containers:
        - name: netflix-tvmaze
          image: YOUR_DOCKERHUB_USERNAME/netflix-tvmaze:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
